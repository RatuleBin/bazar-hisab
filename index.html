<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E7A5F"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="বাজার হিসাব">
<title>মাসিক বাজার হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF3F1;--card:#fff;--ink:#12302A;--mute:#5E7570;--line:#D5E0DC;--acc:#0E7A5F;--accink:#fff;--warn:#C2410C;--soft:#E2F1EC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A17;--card:#172622;--ink:#E6F1ED;--mute:#8FA8A1;--line:#26403A;--acc:#3DCBA0;--accink:#06231B;--warn:#FB923C;--soft:#1D3A32;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1A17;--card:#172622;--ink:#E6F1ED;--mute:#8FA8A1;--line:#26403A;--acc:#3DCBA0;--accink:#06231B;--warn:#FB923C;--soft:#1D3A32;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff,'Hind Siliguri','Noto Sans Bengali',Kalpurush,SolaimanLipi,system-ui,sans-serif);line-height:1.5;font-size:16px}
main{max-width:560px;margin:0 auto;padding:12px 14px 120px}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--acc);color:var(--accink);font-weight:600;min-height:44px}
button.ghost{background:transparent;color:var(--mute);padding:6px 10px;font-weight:500;min-height:40px}
.row{display:flex;gap:8px;align-items:center}
.mbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.mbar h1{font-size:20px;margin:0;font-weight:700;text-align:center;flex:1}
.mbar button{width:44px;padding:0;background:var(--card);color:var(--ink);border:1px solid var(--line);font-size:20px}
.sum{background:var(--acc);color:var(--accink);border-radius:18px;padding:16px;margin:8px 0 14px}
.sum .big{font-size:34px;font-weight:700;line-height:1.2}
.sum .grid{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:14px}
.sum .pbar{height:8px;background:rgba(255,255,255,.28);border-radius:8px;overflow:hidden;margin-top:10px}
.sum .pbar i{display:block;height:100%;background:var(--accink);opacity:.85}
.sum .note{margin-top:8px;font-size:13px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:18px;margin:0;font-weight:600;flex:1;overflow-wrap:anywhere}
.badge{font-size:12px;padding:2px 10px;border-radius:20px;background:var(--soft);color:var(--acc);font-weight:600;white-space:nowrap}
.badge.over{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0;text-align:center}
.nums div{background:var(--soft);border-radius:10px;padding:6px 4px}
.nums small{display:block;color:var(--mute);font-size:12px}
.nums b{font-size:16px}
.rem.over b{color:var(--warn)}
.rem.zero b{color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.over{background:var(--warn)}
.quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.quick button{background:var(--soft);color:var(--ink);padding:4px 12px;min-height:34px;font-size:13px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chips span{font-size:12px;color:var(--mute)}
.chip{background:var(--soft);color:var(--ink);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:500;min-height:34px}
.empty{text-align:center;padding:28px 10px;color:var(--mute)}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.sugg button{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:500;padding:6px 14px;min-height:38px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:30px;padding:0 22px;min-height:52px;font-size:16px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);width:min(92vw,400px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 12px;font-size:18px}
dialog label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
dialog .row{margin-top:16px;justify-content:flex-end}
dialog .cancel{background:transparent;color:var(--mute)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:14px;display:flex;align-items:center;gap:10px;font-size:14px;z-index:20;max-width:92vw}
.toast[hidden]{display:none}
.res2{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:8px}
.rng{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
.rng h2{font-size:16px;margin:0 0 8px;font-weight:600}
.rng .dates{display:flex;gap:8px}
.rng label{flex:1;font-size:12px;color:var(--mute)}
.rng .res{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.rng .res b{font-size:18px}
.rng .by{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
.f2{display:flex;gap:8px;margin-top:8px}
.f2 input[type=date]{width:46%;flex:none}
.ents{margin-top:10px}
.ent{display:flex;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line);font-size:14px}
.ent .dt{color:var(--mute);font-size:12px;min-width:46px}
.ent .nt{flex:1;color:var(--mute);overflow-wrap:anywhere}
.ent b{white-space:nowrap}
.ent button{background:transparent;color:var(--mute);padding:2px 8px;min-height:36px}
.toast button{background:transparent;color:var(--bg);text-decoration:underline;padding:4px 10px;min-height:36px}
</style>
</head>
<body>
<main>
  <div class="mbar">
    <button id="prev" aria-label="আগের মাস">‹</button>
    <h1 id="mTitle"></h1>
    <button id="next" aria-label="পরের মাস">›</button>
  </div>
  <div class="sum" id="sum"></div>
  <div class="rng" id="rng"></div>
  <input type="search" id="q" placeholder="🔍 খরচ বা নোট খুঁজুন" aria-label="খুঁজুন" style="margin-bottom:10px">
  <div id="list"></div>
  <div style="text-align:center;margin-top:18px"><button class="ghost" id="rp">📊 রিপোর্ট</button><button class="ghost" id="bk">💾 ব্যাকআপ / ফেরত আনুন</button><button class="ghost" id="st">⚙️ সেটিংস</button></div>
  <div id="syncSt" style="text-align:center;font-size:12px;color:var(--mute);margin-top:4px"></div>
</main>
<button class="fab" id="fab">+ নতুন খরচ</button>

<dialog id="dlg">
  <h3 id="dTitle"></h3>
  <label for="dName">খরচের নাম</label>
  <input id="dName" placeholder="যেমন: বাসা ভাড়া">
  <label for="dAmt">মাসের বাজেট (৳)</label>
  <input id="dAmt" type="text" inputmode="numeric" placeholder="যেমন: ১৫০০০">
  <div class="row"><button class="cancel" id="dCancel">বাতিল</button><button id="dSave">সংরক্ষণ</button></div>
</dialog>
<dialog id="rpDlg"><h3>📊 মাসের রিপোর্ট</h3><div id="rpBody"></div><div class="row"><button id="rpClose">বন্ধ</button></div></dialog>
<dialog id="bkDlg">
  <h3>ব্যাকআপ ও ফেরত আনা</h3>
  <p style="font-size:13px;color:var(--mute);margin:0 0 8px">কপি করে নোটস/ফাইলে সেভ করুন। ফেরত আনতে আগের ব্যাকআপের লেখাটা খানে পেস্ট করে ফেরত আনুন চাপুন (মাস অনুযায়ী মিলিয়ে নেওয়া হয়, কিছু মুছে যায় না)।</p>
  <textarea id="bkTxt" rows="7" style="width:100%;font:12px monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px"></textarea>
  <p id="bkMsg" style="font-size:13px;color:var(--warn);margin:6px 0 0"></p>
  <div class="row" style="flex-wrap:wrap"><button class="cancel" id="bkClose">বন্ধ</button><button id="bkCopy">কপি</button><button id="bkCsv">CSV</button><button id="bkDl">ফাইল</button><button id="bkRestore">ফেরত আনুন</button></div>
</dialog>
<dialog id="stDlg"><h3>⚙️ সেটিংস</h3>
  <label>ফন্ট বেছে নিন</label><div id="fontList" class="sugg" style="justify-content:flex-start;margin-top:4px"></div>
  <label style="margin-top:16px">☁ সব ডিভাইসে ডেটা মেলানো (সিঙ্ক)</label><div id="syncBox"></div>
  <div class="row"><button id="stClose">বন্ধ</button></div></dialog>
<div class="toast" id="toast" hidden><span id="tMsg"></span><button id="tUndo">ফিরিয়ে আনুন</button></div>

<script>
const KEY='bazar-hisab-v1';
let db={},del={};
try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){db={}}
try{del=JSON.parse(localStorage.getItem('bazar-del-v1')||'{}')}catch(e){del={}}
Object.values(db).forEach(l=>Array.isArray(l)&&l.forEach(i=>{i.paid=(i.paid||[]).map(p=>typeof p==='number'?{a:p,d:'',n:''}:p)}));
ensureIds(db);
const $=id=>document.getElementById(id);
const fmt=n=>'৳ '+Number(n).toLocaleString('bn-BD');
const BN='০১২৩৪৫৬৭৮৯';
function num(s){s=String(s).replace(/[০-৯]/g,c=>BN.indexOf(c)).replace(/[,\s৳]/g,'');const v=parseFloat(s);return isNaN(v)?NaN:v}
const now=new Date();
let cur=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
let editIdx=-1,undoFn=null,tTimer=null;
let newFrom=0,q='';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayS=iso(now);
let lastDate=todayS;
let rg={from:todayS,to:iso(new Date(now.getFullYear(),now.getMonth()+1,0))};
try{const s=JSON.parse(localStorage.getItem('bazar-range-v1')||'null');if(s&&s.from&&s.to)rg=s}catch(e){}
const dObj=s=>new Date(s+'T00:00:00');
const fmtD=s=>s?dObj(s).toLocaleDateString('bn-BD',{day:'numeric',month:'short'}):'—';
const bn=n=>Number(n).toLocaleString('bn-BD');
function renderRange(){
  const a=rg.from,b=rg.to,ok=a&&b&&a<=b;
  let h='<h2>📅 তারিখ ধরে খরচ</h2><div class="dates"><label>শুরুর তারিখ<input type="date" id="rf" value="'+(a||'')+'"></label><label>শেষ তারিখ<input type="date" id="rt" value="'+(b||'')+'"></label></div>';
  if(!ok){$('rng').innerHTML=h+'<div class="res">দুটো তারিখ বেছে নিন (শেষ তারিখ শুরুর পরে হতে হবে)।</div>';return}
  let spent=0,by={};
  Object.values(db).forEach(l=>{if(Array.isArray(l))l.forEach(i=>i.paid.forEach(p=>{if(p.d&&p.d>=a&&p.d<=b){spent+=p.a;by[i.name]=(by[i.name]||0)+p.a}}))});
  let tb=0,tp=0;items().forEach(i=>{tb+=i.budget;i.paid.forEach(p=>tp+=p.a)});
  const left=tb-tp,days=Math.round((dObj(b)-dObj(a))/864e5)+1;
  const st=todayS>a?todayS:a,rem=Math.round((dObj(b)-dObj(st))/864e5)+1;
  h+='<div class="res">'+bn(days)+' দিনে মোট খরচ: <b>'+fmt(spent)+'</b>';
  Object.entries(by).sort((x,y)=>y[1]-x[1]).forEach(([k,v])=>{h+='<div class="by"><span>'+esc(k)+'</span><span>'+fmt(v)+'</span></div>'});
  if(!spent)h+='<div class="by">এই সময়ে তারিখসহ কোনো খরচ নেই</div>';
  if(rem>0&&left>0)h+='<div style="margin-top:8px">এই মাসের বাজেটে বাকি '+fmt(left)+'। '+(todayS>a?'আজ থেকে ':'')+bn(rem)+' দিনে দিনে খরচ করতে পারবেন প্রায় <b>'+fmt(Math.floor(left/rem))+'</b></div>';
  else if(left<=0)h+='<div style="margin-top:8px">এই মাসের বাজেট শেষ বা ছাড়িয়ে গেছে।</div>';
  $('rng').innerHTML=h+'</div>';
}
const SUGG=['বাসা ভাড়া','চাল','ডাল','তেল','সবজি','মাছ-মাংস','বিদ্যুৎ বিল','গ্যাস বিল','ইন্টারনেট'];
function save(){ensureIds(db);persist();clearTimeout(syncT);syncT=setTimeout(sync,1500)}
function items(){
  if(!db[cur]){
    const prev=Object.keys(db).filter(k=>k<cur).sort().pop();
    db[cur]=prev?db[prev].map(i=>({name:i.name,budget:i.budget,paid:[]})):[];
    if(prev&&db[prev].length)newFrom=db[prev].length;
    save();
  }
  return db[cur];
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shift(d){
  const [y,m]=cur.split('-').map(Number),n=new Date(y,m-1+d,1);
  cur=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');render();
}
function toast(msg,fn,lbl){
  $('tMsg').textContent=msg;undoFn=fn;$('tUndo').style.display=fn?'':'none';$('tUndo').textContent=lbl||'ফিরিয়ে আনুন';
  $('toast').hidden=false;clearTimeout(tTimer);tTimer=setTimeout(()=>{$('toast').hidden=true},6000);
}
function render(){
  const [y,m]=cur.split('-').map(Number);
  $('mTitle').textContent=new Date(y,m-1,1).toLocaleDateString('bn-BD',{month:'long',year:'numeric'});
  const list=items();
  const lastD=(lastDate.slice(0,7)===cur?lastDate:cur+'-01');renderRange();
  let tb=0,tp=0,over=0;
  list.forEach(i=>{const p=i.paid.reduce((a,b)=>a+b.a,0);tb+=i.budget;tp+=p;if(p>i.budget)over++});
  const left=tb-tp,pct=tb>0?Math.min(100,tp/tb*100):0;
  $('sum').innerHTML='<div>এই মাসে মোট বাকি</div><div class="big">'+fmt(left)+'</div>'
    +'<div class="pbar"><i style="width:'+pct+'%"></i></div>'
    +'<div class="grid"><span>বাজেট '+fmt(tb)+'</span><span>খরচ হয়েছে '+fmt(tp)+'</span></div>'
    +(over?'<div class="note">⚠ '+over.toLocaleString('bn-BD')+'টি খরচ বাজেটের বেশি হয়ে গেছে</div>':'');
  if(!list.length){
    $('list').innerHTML='<div class="empty"><p>এই মাসে এখনো কোনো খরচ যোগ করা হয়নি।<br>নিচের তালিকা থেকে বেছে নিন, অথবা “নতুন খরচ” চাপুন।</p><div class="sugg">'
      +SUGG.map(s=>'<button data-sugg="'+esc(s)+'">'+esc(s)+'</button>').join('')+'</div></div>';
    return;
  }
  const qq=q.trim().toLowerCase(),hit=(s)=>String(s||'').toLowerCase().includes(qq);
  const shown=list.map((it,idx)=>({it,idx})).filter(o=>!qq||hit(o.it.name)||o.it.paid.some(p=>hit(p.n)));
  let qsum='';
  if(qq){let t=0;shown.forEach(o=>o.it.paid.forEach(p=>{if(hit(o.it.name)||hit(p.n))t+=p.a}));qsum='<div class="res2">“'+esc(q)+'” — '+bn(shown.length)+'টি আইটেম, মোট খরচ '+fmt(t)+'</div>'}
  $('list').innerHTML=qsum+(shown.length?shown.map(({it,idx})=>{
    const p=it.paid.reduce((a,b)=>a+b.a,0),r=it.budget-p;
    const w=it.budget>0?Math.min(100,p/it.budget*100):(p>0?100:0);
    const cls=r<0?'over':r===0?'zero':'';
    const badge=r<0?'<span class="badge over">'+fmt(-r)+' বেশি</span>':r===0&&it.budget>0?'<span class="badge">শেষ ✓</span>':(it.budget>0&&p/it.budget>=0.8?'<span class="badge over">⚠ ৮০%+ খরচ</span>':'');
    return '<div class="card"><div class="row"><h2>'+esc(it.name)+'</h2>'+badge+'</div>'
    +'<div class="nums"><div><small>বাজেট</small><b>'+fmt(it.budget)+'</b></div><div><small>খরচ</small><b>'+fmt(p)+'</b></div><div class="rem '+cls+'"><small>'+(r<0?'বেশি':'বাকি')+'</small><b>'+fmt(Math.abs(r))+'</b></div></div>'
    +'<div class="bar"><i class="'+(r<0||(it.budget>0&&p/it.budget>=0.8)?'over':'')+'" style="width:'+w+'%"></i></div>'
    +'<div class="row"><input type="text" inputmode="numeric" placeholder="কত টাকা খরচ করলেন?" id="p'+idx+'" data-enter="'+idx+'"><button data-pay="'+idx+'">যোগ করুন</button></div>'
    +'<div class="f2"><input type="date" id="d'+idx+'" value="'+lastD+'" aria-label="তারিখ"><input type="text" id="n'+idx+'" placeholder="নোট (যেমন: রহিমের দোকান)" maxlength="80" aria-label="নোট"></div>'
    +'<div class="quick">'+[100,500,1000,2000].map(q=>'<button data-q="'+idx+','+q+'">+'+q.toLocaleString('bn-BD')+'</button>').join('')+(r>0?'<button data-q="'+idx+','+r+'">বাকি সবটা</button>':'')+'</div>'
    +(it.paid.length?'<div class="ents">'+it.paid.map((p,j)=>'<div class="ent"><span class="dt">'+fmtD(p.d)+'</span><span class="nt">'+esc(p.n||'')+'</span><b>'+fmt(p.a)+'</b><button data-undo="'+idx+','+j+'" aria-label="মুছুন">✕</button></div>').join('')+'</div>':'')
    +'<div class="row" style="justify-content:flex-end;margin-top:6px"><button class="ghost" data-edit="'+idx+'">✎ সম্পাদনা</button><button class="ghost" data-del="'+idx+'">মুছুন</button></div>'
    +'</div>';
  }).join(''):'<div class="empty">কিছু পাওয়া যায়নি।</div>');
  if(newFrom&&!qq){const c=newFrom;newFrom=0;toast('আগের মাস থেকে '+bn(c)+'টি আইটেমের বাজেট নিয়ে এসেছি',()=>{db[cur].forEach(x=>del[x.id]=Date.now());db[cur]=[];save();render()},'বাদ দিন')}
}
function openDlg(idx,name){
  editIdx=idx;const it=idx>=0?items()[idx]:null;
  $('dTitle').textContent=it?'খরচ সম্পাদনা':'নতুন খরচ যোগ করুন';
  $('dName').value=it?it.name:(name||'');$('dAmt').value=it?it.budget:'';
  $('dlg').showModal();setTimeout(()=>(name&&!it?$('dAmt'):$('dName')).focus(),50);
}
function saveDlg(){
  const n=$('dName').value.trim(),a=num($('dAmt').value||'0');
  if(!n){$('dName').focus();return}
  if(!(a>=0)){$('dAmt').focus();return}
  const list=items();
  if(editIdx>=0){list[editIdx].name=n;list[editIdx].budget=a;list[editIdx].u=Date.now()}else list.push({id:uid(),u:Date.now(),name:n,budget:a,paid:[]});
  save();$('dlg').close();render();
}
function addPay(i,v){
  if(!(v>0))return;
  const d=$('d'+i).value,n=$('n'+i).value.trim();if(d)lastDate=d;
  items()[i].paid.push({a:v,d:d,n:n,id:uid()});save();render();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const list=items(),d=t.dataset;
  if(d.pay!==undefined){const i=+d.pay;addPay(i,num($('p'+i).value))}
  else if(d.q!==undefined){const [i,q]=d.q.split(',').map(Number);addPay(i,q)}
  else if(d.undo!==undefined){
    const [i,j]=d.undo.split(',').map(Number),v=list[i].paid.splice(j,1)[0];del[v.id]=Date.now();save();render();
    toast(fmt(v.a)+' মুছে ফেলা হয়েছে',()=>{delete del[v.id];items()[i].paid.splice(j,0,v);save();render()});
  }else if(d.del!==undefined){
    const i=+d.del,it=list.splice(i,1)[0];del[it.id]=Date.now();save();render();
    toast('“'+it.name+'” মুছে ফেলা হয়েছে',()=>{delete del[it.id];items().splice(i,0,it);save();render()});
  }else if(d.edit!==undefined)openDlg(+d.edit);
  else if(d.sugg!==undefined)openDlg(-1,d.sugg);
});

const CLOUD={project:'bazar-34aa6',key:'AIzaSyCGvpJ505oAynnP41UqEVCK0wiL5RMS9tk'}; // README দেখুন: Firebase projectId ও apiKey এখানে বসান
const uid=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function isM(k){return /^\d{4}-\d{2}$/.test(k)}
function ensureIds(d){Object.keys(d).forEach(k=>{if(!isM(k)||!Array.isArray(d[k]))return;const us=new Set();d[k].forEach((i,x)=>{if(!i.id){let id='i-'+k+'-'+i.name;if(us.has(id))id+='-'+x;i.id=id}us.add(i.id);i.paid=i.paid||[];const ps=new Set();i.paid.forEach((p,j)=>{if(!p.id){let q='p-'+i.id+'-'+p.a+'-'+(p.d||'')+'-'+(p.n||'');if(ps.has(q))q+='-'+j;p.id=q}ps.add(p.id)})})})}
function merge(A,B){
  const dl=Object.assign({},A.del,B.del),o={};
  new Set([...Object.keys(A.db),...Object.keys(B.db)].filter(isM)).forEach(k=>{
    const m=new Map();
    [A.db[k],B.db[k]].forEach(l=>(l||[]).forEach(i=>{
      if(!i.id||dl[i.id])return;
      const e=m.get(i.id);
      if(!e){m.set(i.id,Object.assign({},i,{paid:(i.paid||[]).filter(p=>!dl[p.id])}));return}
      if((i.u||0)>(e.u||0)){e.name=i.name;e.budget=i.budget;e.u=i.u}
      const ids=new Set(e.paid.map(p=>p.id));
      (i.paid||[]).forEach(p=>{if(!dl[p.id]&&!ids.has(p.id)){e.paid.push(p);ids.add(p.id)}});
    }));
    o[k]=[...m.values()];
  });
  return {db:o,del:dl};
}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('bazar',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbSet(k,v){try{const d=await idb();return await new Promise(r=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=()=>r(1);t.onerror=()=>r(0)})}catch(e){}}
async function idbGet(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));localStorage.setItem('bazar-del-v1',JSON.stringify(del))}catch(e){}idbSet('db',JSON.stringify({db:db,del:del}))}
let sid=localStorage.getItem('bazar-sync-id')||'',syncT=null,syncing=false;
{const m=/[#&]sync=([A-Za-z0-9]{20,})/.exec(location.hash);if(m){sid=m[1];try{localStorage.setItem('bazar-sync-id',sid)}catch(e){}history.replaceState(null,'',location.pathname+location.search)}}

const cUrl=()=>'https://firestore.googleapis.com/v1/projects/'+CLOUD.project+'/databases/(default)/documents/ledgers/'+sid+'?key='+CLOUD.key;
const setSt=t=>{const e=$('syncSt');if(e){e.textContent=t;e.style.cursor='pointer'}};
async function errMsg(r){try{const j=await (r.clone?r.clone():r).json();return (j.error&&j.error.message||'').slice(0,140)}catch(e){return ''}}
async function sync(){
  if(!CLOUD.project||!sid||syncing)return;syncing=true;setSt('☁ সিঙ্ক হচ্ছে…');
  try{
    const r=await fetch(cUrl());let rem={db:{},del:{}};
    if(r.ok){const j=await r.json();rem=JSON.parse(j.fields.data.stringValue)}else{const em=await errMsg(r);if(r.status!==404||!em.includes('Document'))throw new Error(r.status+' '+em)}
    rem.db=rem.db||{};rem.del=rem.del||{};ensureIds(rem.db);
    const before=JSON.stringify(db),m=merge({db,del},rem);db=m.db;del=m.del;persist();
    if(JSON.stringify(db)!==before)render();
    const out=JSON.stringify({db:db,del:del});
    if(out!==JSON.stringify(rem)){const w=await fetch(cUrl(),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{data:{stringValue:out}}})});if(!w.ok)throw new Error(w.status+' '+await errMsg(w))}
    setSt('☁ সিঙ্ক হয়েছে ✓ '+new Date().toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'})+' · কোড: '+sid.slice(0,6)+'… (চাপলে আবার সিঙ্ক)');
  }catch(e){setSt('☁ সিঙ্ক হয়নি: '+(navigator.onLine?e.message:'অফলাইন')+' · কোড: '+sid.slice(0,6)+'… (চাপলে আবার চেষ্টা) — ডেটা এই ফোনে নিরাপদ')}
  syncing=false;
}

const FONTS={'Hind Siliguri':'Hind+Siliguri:wght@400;500;600;700','Noto Sans Bengali':'Noto+Sans+Bengali:wght@400;500;600;700','Anek Bangla':'Anek+Bangla:wght@400;500;600;700','Baloo Da 2':'Baloo+Da+2:wght@400;500;600;700','Noto Serif Bengali':'Noto+Serif+Bengali:wght@400;500;600;700'};

function applyFont(f){font=f;try{localStorage.setItem('bazar-font',f)}catch(e){}loadFont(f);document.documentElement.style.setProperty('--ff',"'"+f+"','Hind Siliguri','Noto Sans Bengali',Kalpurush,SolaimanLipi,system-ui,sans-serif")}

}
